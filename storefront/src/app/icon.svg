<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="farmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143625" />
      <stop offset="100%" stop-color="#0B2317" />
    </linearGradient>
    <linearGradient id="gheeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF05A" />
      <stop offset="45%" stop-color="#FFC719" />
      <stop offset="100%" stop-color="#E07C00" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Premium Deep Vedic Forest Green Rounded Badge -->
  <rect width="512" height="512" rx="128" fill="url(#farmBg)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#F7B519" stroke-width="4" stroke-opacity="0.35" />

  <!-- Iconic Seth Organic Golden Drop with Sacred Negative Space Cow Silhouette -->
  <g transform="translate(148, 54) scale(2.2)" filter="url(#subtleGlow)">
    <path d="M 48 6 C 48 6, 94 58, 94 90 C 94 114, 73 128, 46 126 C 32 125, 22 120, 18 117 C 28 114, 38 103, 40 88 C 41 78, 47 74, 56 76 C 63 77, 68 74, 67 68 C 66 63, 59 56, 56 51 C 59 46, 58 40, 54 38 C 51 41, 48 44, 44 44 C 40 41, 35 37, 31 38 C 31 42, 33 46, 35 49 C 28 50, 21 53, 15 50 C 26 35, 41 18, 48 6 Z" fill="url(#gheeGold)" />
  </g>

  <!-- Bold "SETH" Serif Monogram / Wordmark -->
  <text x="256" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SETH</text>

  <!-- ORGANIC FARM Sub-headline -->
  <text x="256" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F7B519" text-anchor="middle" letter-spacing="7">ORGANIC</text>

  <!-- Golden Accent Leaf Emblem at Bottom -->
  <g transform="translate(256, 462)" fill="#F7B519">
    <ellipse cx="0" cy="-3" rx="2.5" ry="5.5" />
    <ellipse cx="-5.5" cy="-1" rx="2.2" ry="4.5" transform="rotate(-35 -5.5 -1)" />
    <ellipse cx="5.5" cy="-1" rx="2.2" ry="4.5" transform="rotate(35 5.5 -1)" />
  </g>
</svg>
